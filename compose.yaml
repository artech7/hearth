name: hearth

services:
  hearth:
    build: .
    image: hearth:latest
    # Rebuild on every `up`, so a git pull that changes the source actually
    # ships. Without this, compose reuses the existing hearth:latest and a
    # redeploy silently runs the old code. Cached layers keep it fast.
    pull_policy: build
    container_name: hearth
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${HEARTH_PORT:-8080}:8080"
    environment:
      # Task days and allowance renewal follow this clock. Set it to your own.
      TZ: ${TZ:-America/Denver}
    volumes:
      - hearth-data:/data
    # The app writes nothing but DATA_FILE, so everything else can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hearth-data:
