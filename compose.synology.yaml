name: hearth

services:
  hearth:
    image: ghcr.io/artech7/hearth:latest
    # Always fetch from the registry so Dockhand's "update image" really
    # replaces the container instead of reusing a cached tag.
    pull_policy: always
    container_name: hearth
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      # Host port : container port. The container always listens on 8080.
      - "58422:8080"
    environment:
      # Daily resets and weekly allowance renewal follow this clock.
      TZ: America/Denver
    volumes:
      - /volume1/docker/hearth/data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
