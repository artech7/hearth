name: hearth

services:
  hearth:
    image: ghcr.io/artech7/hearth:latest
    # Always fetch from the registry on up/update rather than reusing whatever
    # tag is cached locally.
    pull_policy: always
    container_name: hearth
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      # Host port is yours to pick. The container always listens on 8080.
      - "58422:8080"
    environment:
      TZ: America/Denver
    volumes:
      # A directory of its own, not the folder holding the source files.
      #   sudo mkdir -p /volume1/docker/hearth/data
      #   sudo chown -R 1000:1000 /volume1/docker/hearth/data
      - /volume1/docker/hearth/data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
