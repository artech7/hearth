name: hearth

services:
  hearth:
    image: ghcr.io/artech7/hearth:latest
    # Always fetch from the registry rather than reusing a cached tag, so
    # Dockhand's "update image" actually replaces the running container.
    pull_policy: always
    container_name: hearth
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      # Host port : container port. The container always listens on 8080.
      - "58422:8080"
    environment:
      # Daily task resets and weekly allowance renewal follow this clock.
      TZ: America/Denver
    volumes:
      # This MUST match what your running stack already uses, or the app
      # starts against an empty data file.
      - hearth-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hearth-data:
